gripper_node:
  ros__parameters:

    control_topic: "/control/joint_states"
    feedback_topic: "/feedback/joint_states"
    gripper_joint_name: "gripper"

    # Total jaw opening width. Official AgileX range: [0.0, 0.1] m.
    # 0.090 leaves a little margin from the hard maximum.
    open_width_m: 0.070

    # NOT USED in STEP 7C.
    # Measure/tune before the actual grasp-closing step.
    close_width_m: 0.043

    # Official AgileX gripper force range: [0.5, 3.0] N.
    command_force_n: 1.0

    position_tolerance_m: 0.006
    command_timeout_sec: 4.0
    command_publish_hz: 10.0
